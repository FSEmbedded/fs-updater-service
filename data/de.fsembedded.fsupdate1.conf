<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  /etc/dbus-1/system.d/de.fsembedded.fsupdate1.conf
  D-Bus system bus policy for the F&S Update Framework service.

  Installed by: fs-updater-service Yocto recipe
-->
<busconfig>

  <!--
    This policy is the enforcement point. The service does not consult
    polkit: the shipped .policy actions are declared but never queried by
    the handlers, and polkit is not installed on the image. Querying it
    would demand auth_admin for every mutating call, which needs an
    interactive session the device does not have. The bus is therefore
    gated here, to root and adu only; there is no polkit backstop.
  -->

  <!--
    The service process runs as root and owns the bus name. Root also needs
    an explicit send_destination allow here — "own=" alone does not grant
    method-call reachability, and root previously reached the methods only
    via the now-removed default-context allow below.
  -->
  <policy user="root">
    <allow own="de.fsembedded.fsupdate1"/>
    <allow send_destination="de.fsembedded.fsupdate1"
           send_interface="de.fsembedded.fsupdate1"/>
    <allow send_destination="de.fsembedded.fsupdate1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="de.fsembedded.fsupdate1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>

  <!--
    adu user (AducIotAgent) is allowed to call all methods and read all
    properties. This is the coarse-grained bus-level gate.
  -->
  <policy user="adu">
    <allow send_destination="de.fsembedded.fsupdate1"
           send_interface="de.fsembedded.fsupdate1"/>
    <allow send_destination="de.fsembedded.fsupdate1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="de.fsembedded.fsupdate1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>

  <!--
    No default-context allow: any local user other than root/adu is denied
    by the implicit system-bus default (no policy match => no access).
  -->

</busconfig>
